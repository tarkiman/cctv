name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

# ─── Secrets yang harus dikonfigurasi di repo Settings → Secrets ─────────────
#   DISCORD_WEBHOOK — URL webhook Discord untuk notifikasi

jobs:

  # ─── 1. Notifikasi: build dimulai ──────────────────────────────────────────
  notify-start:
    name: Notify — started
    runs-on: ubuntu-latest
    steps:
      - name: Discord — build started
        continue-on-error: true
        run: |
          jq -n \
            --arg desc "**cctv** — building from \`${{ github.ref_name }}\` ([\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}))" \
            --arg footer "by ${{ github.actor }}" \
            '{embeds:[{title:"🚀 Build Started",description:$desc,color:3447003,footer:{text:$footer}}]}' | \
          curl -fsSo /dev/null -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" -d @-

  # ─── 2a. Build panel — parallel ────────────────────────────────────────────
  build-panel:
    name: Build panel
    runs-on: ubuntu-latest
    needs: notify-start
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            changed:
              - 'panel/**'
      - uses: docker/setup-qemu-action@v3
        if: steps.changes.outputs.changed == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.changed == 'true'
      - uses: docker/login-action@v3
        if: steps.changes.outputs.changed == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push panel
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./panel
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/cctv-panel:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/cctv-panel:${{ github.sha }}
          cache-from: type=gha,scope=cctv-panel
          cache-to: type=gha,mode=max,scope=cctv-panel

  # ─── 2b. Build timelapse — parallel ───────────────────────────────────────
  build-timelapse:
    name: Build timelapse
    runs-on: ubuntu-latest
    needs: notify-start
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            changed:
              - 'timelapse/**'
      - uses: docker/setup-qemu-action@v3
        if: steps.changes.outputs.changed == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.changed == 'true'
      - uses: docker/login-action@v3
        if: steps.changes.outputs.changed == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push timelapse
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./timelapse
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/cctv-timelapse:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/cctv-timelapse:${{ github.sha }}
          cache-from: type=gha,scope=cctv-timelapse
          cache-to: type=gha,mode=max,scope=cctv-timelapse

  # ─── 3. Notifikasi: hasil akhir ────────────────────────────────────────────
  notify-result:
    name: Notify — result
    runs-on: ubuntu-latest
    needs: [build-panel, build-timelapse]
    if: always()
    steps:
      - name: Discord — success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        continue-on-error: true
        run: |
          jq -n \
            --arg desc "**cctv** — images pushed to GHCR ✓ ([\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}))" \
            --arg footer "by ${{ github.actor }}" \
            '{embeds:[{title:"✅ Build Succeeded",description:$desc,color:3066993,footer:{text:$footer}}]}' | \
          curl -fsSo /dev/null -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" -d @-
      - name: Discord — failure
        if: ${{ contains(needs.*.result, 'failure') }}
        continue-on-error: true
        run: |
          jq -n \
            --arg desc "**cctv** — build failed ✗ ([View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))" \
            --arg footer "by ${{ github.actor }}" \
            '{embeds:[{title:"❌ Build Failed",description:$desc,color:15158332,footer:{text:$footer}}]}' | \
          curl -fsSo /dev/null -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" -d @-
