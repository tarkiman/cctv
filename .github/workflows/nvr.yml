name: NVR Lite

on:
  push:
    branches: [main]
    paths: ['nvr/**', '.github/workflows/nvr.yml']
  pull_request:
    paths: ['nvr/**', '.github/workflows/nvr.yml']
  workflow_dispatch:

# Secrets (optional): DISCORD_WEBHOOK — build result notifications.

concurrency:
  group: nvr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: nvr/server/go.mod
          cache-dependency-path: nvr/server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nvr/web/package-lock.json
      - name: Web — typecheck & build
        working-directory: nvr/web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Go — vet & test
        working-directory: nvr/server
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt"; exit 1; }
          go vet ./...
          go test -race ./...

  image:
    name: Image (arm64)
    needs: test
    if: github.event_name != 'pull_request'
    # Native arm64 runner: umma and the Pi are arm64, and QEMU builds are slow.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./nvr
          platforms: linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.short }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/cctv-nvr:latest
            ghcr.io/${{ github.repository_owner }}/cctv-nvr:${{ steps.meta.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cctv-nvr
          cache-to: type=gha,mode=max,scope=cctv-nvr
      - name: Build & push detector
        uses: docker/build-push-action@v6
        with:
          context: ./nvr/detect
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cctv-nvr-detect:latest
            ghcr.io/${{ github.repository_owner }}/cctv-nvr-detect:${{ steps.meta.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cctv-nvr-detect
          cache-to: type=gha,mode=max,scope=cctv-nvr-detect

  notify:
    name: Notify
    needs: [test, image]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Discord
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          OK: ${{ needs.test.result == 'success' && needs.image.result == 'success' }}
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          if [ "$OK" = true ]; then title="✅ NVR Lite image ready"; color=3066993
          else title="❌ NVR Lite build failed"; color=15158332; fi
          jq -n --arg t "$title" --argjson c "$color" \
            --arg d "\`${GITHUB_SHA::7}\` on \`${{ github.ref_name }}\` — [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            '{embeds:[{title:$t,description:$d,color:$c}]}' |
            curl -fsSo /dev/null -X POST "$WEBHOOK" -H "Content-Type: application/json" -d @-
