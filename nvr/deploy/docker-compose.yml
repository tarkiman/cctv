# NVR Lite on umma. Both services use host networking: go2rtc needs it for Xiaomi P2P
# (UDP hole punching), and nvrd then reaches go2rtc on 127.0.0.1 without exposing
# go2rtc's API to the network.
services:
  go2rtc:
    image: alexxit/go2rtc:1.9.14
    container_name: nvr-go2rtc
    restart: unless-stopped
    network_mode: host
    # Public DNS over UDP is dropped on this network; Xiaomi cloud login needs DNS.
    dns: [192.168.1.1]
    volumes:
      - ${NVR_DATA:-/DATA/nvr}/go2rtc:/config

  nvrd:
    image: ghcr.io/tarkiman/cctv-nvr:${NVR_TAG:-latest}
    container_name: nvr-nvrd
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ${NVR_DATA:-/DATA/nvr}:/data
    depends_on: [go2rtc]
    healthcheck:
      test: ["CMD-SHELL", "port=$${NVR_LISTEN:-:8090}; wget -qO- http://127.0.0.1:$${port##*:}/api/v1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s

  # Person detection (fase 3). Opt-in: `docker compose --profile detect up -d`, or set
  # COMPOSE_PROFILES=detect in .env. Without it nvrd still does motion detection.
  detect:
    image: ghcr.io/tarkiman/cctv-nvr-detect:${NVR_TAG:-latest}
    container_name: nvr-detect
    restart: unless-stopped
    profiles: [detect]
    network_mode: host
    environment:
      DETECT_LISTEN: 127.0.0.1:8092
      DETECT_THREADS: ${NVR_DETECT_THREADS:-1}
    # Keep recording safe on small hosts: at most one core and 300 MB.
    cpus: ${NVR_DETECT_CPUS:-1.0}
    mem_limit: 300m
